{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Page</title>
  <link rel="stylesheet" href="{% static 'css/loginpage.css' %}" />
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #code {
      *, ::after, ::before {
        box-sizing: content-box !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="opacity: 0.5;">
      <a class="navbar-brand" href="{% url 'home' %}">
        <img src="{% static 'Assets/images/Logo.svg' %}" alt="Logo">
      </a>
    </nav>
  </header>

  <main>
    <div>
      <h1 class="Forgot" style="font-size: 3.5rem">Verification</h1>
      <div>
        <form id="form" action="{% url 'new_password' %}">
          <p class="verfiy">Enter Verification Code</p>
          <p id="code">
            <input type="text" name="digit1" maxlength="1" class="number" />
            <input type="text" name="digit2" maxlength="1" class="number" />
            <input type="text" name="digit3" maxlength="1" class="number" />
            <input type="text" name="digit4" maxlength="1" class="number" />
          </p>
          <p class="Resend">
            If you didn't receive a code, <a href="#">Resend</a>
          </p>
          <button type="submit" name="verify" class="otp">Verify</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container-fluid">
      <div class="d-flex justify-content-end py-3">
        <ul class="list-inline mb-0">
          <li class="list-inline-item"><img src="{% static 'Assets/Icons/icons8-instagram.svg' %}" alt="Instagram"></li>
          <li class="list-inline-item"><img src="{% static 'Assets/Icons/x.svg' %}" alt="X"></li>
          <li class="list-inline-item"><img src="{% static 'Assets/Icons/git.svg' %}" alt="GitHub"></li>
          <li class="list-inline-item"><a class="text-white" href="#">Terms of Service</a></li>
          <li class="list-inline-item"><a class="text-white" href="#">Privacy Policy</a></li>
          <li class="list-inline-item"><a class="text-white" href="#">Code Conversion</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
